# Knative, by way of its operator rather than the release manifests.
#
# The alternative would be copying serving-crds.yaml and serving-core.yaml into this
# repository -- some 930 KB of generated YAML that has to be replaced wholesale on
# every upgrade. The operator is a small chart, and what it installs is then
# described by a KnativeServing resource that fits on a screen.
#
# Kourier is the ingress, not net-gateway-api: the Gateway API CRDs are present
# because Cilium installs them, but Knative's Gateway API support expects features
# Cilium's implementation does not fully provide. Kourier is what Knative ships and
# tests against.
---
apiVersion: v1
kind: Namespace
metadata:
  name: knative-serving
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knative-operator
  # argocd, not the destination namespace: ArgoCD only reconciles Application
  # objects in its own namespace unless application.namespaces is configured.
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    chart: knative-operator
    repoURL: https://knative.github.io/operator
    targetRevision: v1.23.1
    helm:
      valuesObject:
        knative_operator:
          knative_operator:
            # No tolerations, so these never land on the backbone SBCs -- those
            # carry the control-plane taint and 2 GB of RAM.
            tolerations: []
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                memory: 512Mi
          operator_webhook:
            tolerations: []
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                memory: 256Mi
  destination:
    server: "https://kubernetes.default.svc"
    namespace: knative-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# What the operator installs. Everything Knative would otherwise spread across two
# release manifests is described here.
apiVersion: operator.knative.dev/v1beta1
kind: KnativeServing
metadata:
  name: knative-serving
  namespace: knative-serving
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  version: "1.23.0"
  ingress:
    kourier:
      enabled: true
      service-type: LoadBalancer
  config:
    network:
      ingress-class: kourier.ingress.networking.knative.dev
      # Knative's default is {name}.{namespace}.{domain}, which is three labels
      # below home -- and the wildcard in bind9 is *.svc, which matches exactly
      # one. A name like hello.default.kn.home would resolve nowhere. Folding the
      # namespace into the first label keeps every service under a single wildcard.
      domain-template: "{{.Name}}-{{.Namespace}}.{{.Domain}}"
    domain:
      # Its own subdomain rather than svc.home, because Kourier needs an address of
      # its own: *.svc already points at the Cilium ingress on .20.
      kn.home: ""
    # Metrics are off by default in 1.23 -- metrics-protocol defaults to 'none', and
    # the metrics port on every component then serves nothing at all. Measured: zero
    # lines from activator, autoscaler, controller and webhook before this.
    observability:
      metrics-protocol: prometheus
      # The queue-proxy sidecar, which is where request rate and latency per Knative
      # service come from. Without it only the control plane is visible.
      request-metrics-protocol: prometheus
      # 60s is the default; at 30s the numbers line up with the scrape interval
      # Prometheus uses for everything else here.
      metrics-export-interval: 30s
      request-metrics-export-interval: 30s
    autoscaler:
      enable-scale-to-zero: "true"
      # Short, because the point of this cluster is that idle costs nothing.
      scale-to-zero-grace-period: "30s"
  # One of each. The defaults assume a cluster with more than two worker nodes.
  workloads:
    - name: activator
      replicas: 1
    - name: autoscaler
      replicas: 1
    - name: controller
      replicas: 1
    - name: webhook
      replicas: 1
---
# The control plane. Every component carries the same label and the same port name,
# so one selector covers activator, autoscaler, autoscaler-hpa, controller, webhook
# and the Kourier controller.
#
# Note that turning metrics on is not enough on its own: the exporter is built at
# process start, so the components have to be restarted after config-observability
# changes. Measured -- zero metric lines until the rollout, hundreds afterwards.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: knative-serving
  namespace: knative-serving
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  namespaceSelector:
    matchNames:
      - knative-serving
  selector:
    matchLabels:
      app.kubernetes.io/name: knative-serving
  endpoints:
    - port: http-metrics
      interval: 30s
---
# The queue-proxy sidecar, which sits in front of every Knative service and is the
# only source of request rate and latency per revision. A PodMonitor rather than a
# ServiceMonitor: revision pods come and go with scale-to-zero and have no service
# of their own carrying this port.
#
# 9091 and not 9090: the sidecar exposes http-autometric on 9090, which serves
# nothing, and http-usermetric on 9091, which serves the request metrics. Verified
# against a running revision rather than assumed.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: knative-queue-proxy
  namespace: knative-serving
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  # Any namespace: Knative services are deployed wherever their owner puts them.
  namespaceSelector:
    any: true
  selector:
    matchExpressions:
      - key: serving.knative.dev/revision
        operator: Exists
  podMetricsEndpoints:
    - port: http-usermetric
      interval: 30s
