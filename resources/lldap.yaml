# LLDAP, the user directory behind Authelia.
#
# Authelia has no user administration of its own, and its file backend cannot have
# any: the user database arrives from a Secret, which Kubernetes mounts read-only,
# so Authelia can neither add a user nor persist a password change. LLDAP exists for
# exactly this gap -- it is a small LDAP server whose entire point is the web
# interface it ships with, where users and groups are managed in a browser and every
# user can change their own password.
#
# Authelia speaks to it over plain LDAP inside the cluster. No TLS on that hop: it
# never leaves the pod network, and giving LLDAP a certificate would mean teaching
# Authelia to trust the private CA for a connection that Cilium already confines.
#
# sync-wave 1 namespace, 2 secret, 3 the workload.
---
apiVersion: v1
kind: Namespace
metadata:
  name: lldap
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
# The admin account is created from LLDAP_LDAP_USER_PASS on first start, so it
# stays declarative in git while everyone else is managed in the web interface.
# Read it back with
#
#   kubectl -n lldap get secret lldap-secrets \
#     -o jsonpath='{.data.LLDAP_LDAP_USER_PASS}' | base64 -d
#
# Changing it later means re-sealing this secret: LLDAP resets the admin
# password to this value on every start.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: lldap-secrets
  namespace: lldap
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  encryptedData:
    LLDAP_JWT_SECRET: 
    LLDAP_KEY_SEED: 
    LLDAP_LDAP_USER_PASS: 
  template:
    metadata:
      name: lldap-secrets
      namespace: lldap
    type: Opaque
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lldap-data
  namespace: lldap
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  # Replicated: this is the user directory. Unlike the monitoring data it cannot be
  # rebuilt from anywhere, and unlike Authelia's own configuration it is not in git
  # -- users created through the web interface live only here.
  storageClassName: linstor-replicated
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lldap
  namespace: lldap
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  # Recreate, not RollingUpdate: one SQLite file on a ReadWriteOnce volume, so the
  # old pod has to let go before the new one can start.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lldap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lldap
    spec:
      nodeSelector:
        node-role.kubernetes.io/storage-disk: ""
      # fsGroup only, no runAsUser: the image starts as root on purpose and its
      # entrypoint drops to the UID/GID below itself after preparing /data.
      securityContext:
        fsGroup: 1000
      containers:
        - name: lldap
          image: lldap/lldap:v0.6.3-alpine
          env:
            - name: UID
              value: "1000"
            - name: GID
              value: "1000"
            - name: LLDAP_LDAP_BASE_DN
              value: dc=svc,dc=home
            - name: LLDAP_LDAP_USER_DN
              value: admin
            - name: LLDAP_HTTP_URL
              value: https://users.svc.home
            - name: LLDAP_DATABASE_URL
              value: sqlite:///data/users.db?mode=rwc
          envFrom:
            - secretRef:
                name: lldap-secrets
          ports:
            - name: ldap
              containerPort: 3890
            - name: http
              containerPort: 17170
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lldap-data
---
apiVersion: v1
kind: Service
metadata:
  name: lldap
  namespace: lldap
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    app.kubernetes.io/name: lldap
  ports:
    - name: ldap
      port: 3890
      targetPort: ldap
    - name: http
      port: 17170
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lldap
  namespace: lldap
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    cert-manager.io/cluster-issuer: home-ca
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Benutzerverwaltung"
    gethomepage.dev/group: "Dienste"
    gethomepage.dev/icon: mdi-account-group
    gethomepage.dev/description: "LDAP-Verzeichnis hinter dem SSO"
spec:
  ingressClassName: cilium
  rules:
    - host: users.svc.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lldap
                port:
                  name: http
  tls:
    - secretName: lldap-tls
      hosts:
        - users.svc.home
