apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: piraeus-cluster
  # argocd, not the destination namespace: ArgoCD only reconciles Application
  # objects in its own namespace unless application.namespaces is configured.
  namespace: argocd
  annotations:
    # After piraeus-operator, whose CRDs these resources need.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/tak2004/home-ops-apps.git
    targetRevision: main
    path: piraeus
  destination:
    server: "https://kubernetes.default.svc"
    namespace: piraeus-datastore
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The operator needs a moment to register its CRDs. Without a retry the first
    # sync fails for good and the cluster is never created.
    retry:
      limit: 10
      backoff:
        duration: 20s
        maxDuration: 5m
