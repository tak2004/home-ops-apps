# Authelia as the OpenID Connect provider for this cluster, replacing Keycloak.
#
# OIDC only, deliberately. Authelia can also act as a forward-auth gate that puts a
# login wall in front of services with no authentication of their own -- but that
# needs the ingress to call an external authorisation service, and Cilium supports
# neither the nginx-style auth-url annotations nor the Gateway API ExternalAuth
# filter from GEP-1494 (cilium/cilium#45704). Only a hand-written CiliumEnvoyConfig
# with an ext_authz filter would do it. So Hubble UI, Homepage, Prometheus and
# Alertmanager stay unauthenticated for now; Forgejo, Grafana, ArgoCD and Headlamp
# speak OIDC themselves and do not involve the ingress at all.
#
# Everything is generated with the Authelia binary rather than by hand: the random
# keys with `authelia crypto rand`, the signing key with `authelia crypto pair rsa
# generate`, and the password hash with `authelia crypto hash generate argon2`.
#
# sync-wave 1 namespace, 2 secrets, 3 the application -- the SealedSecrets name the
# namespace and cannot wait for the Application to create it.

---
apiVersion: v1
kind: Namespace
metadata:
  name: authelia
  annotations:
    argocd.argoproj.io/sync-wave: "1"

---
# The four keys the chart knows about. Their names are not free: the chart
# mounts exactly these under /secrets/internal and points AUTHELIA_*_FILE
# environment variables at them, so a renamed key is simply not mounted.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: authelia-secrets
  namespace: authelia
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  encryptedData:
    identity_providers.oidc.hmac.key: 
    identity_validation.reset_password.jwt.hmac.key: 
    session.encryption.key: 
    storage.encryption.key: 
  template:
    metadata:
      name: authelia-secrets
      namespace: authelia
    type: Opaque

---
# The RSA key that signs OIDC tokens, in a secret of its own. It cannot live
# in authelia-secrets: the chart builds that volume from a fixed list of four
# items, so any extra key there is silently left out of the pod -- the config
# would reference a path that does not exist.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: authelia-oidc-key
  namespace: authelia
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  encryptedData:
    oidc.jwk.RS256.pem: 
  template:
    metadata:
      name: authelia-oidc-key
      namespace: authelia
    type: Opaque

---
# The user database. The chart only configures a path to it and never supplies
# the file, so it is mounted separately. Passwords are argon2id hashes.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: authelia-users
  namespace: authelia
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  encryptedData:
    users_database.yml: 
  template:
    metadata:
      name: authelia-users
      namespace: authelia
    type: Opaque

---
# Mounted nowhere -- it exists only so the generated password can be read back:
#
#   kubectl -n authelia get secret authelia-initial-password \
#     -o jsonpath='{.data.password\.txt}' | base64 -d
#
# Delete it once you have changed the password in the portal.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: authelia-initial-password
  namespace: authelia
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  encryptedData:
    password.txt: 
  template:
    metadata:
      name: authelia-initial-password
      namespace: authelia
    type: Opaque

---
# The client secret Forgejo presents to Authelia, in Forgejo's namespace.
# Authelia stores only its pbkdf2-sha512 hash; this is the plaintext half.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: forgejo-oidc
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  encryptedData:
    client-id: 
    client-secret: 
  template:
    metadata:
      name: forgejo-oidc
      namespace: forgejo
    type: Opaque

---
# The same for Grafana, in the monitoring namespace.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  encryptedData:
    client-id: 
    client-secret: 
  template:
    metadata:
      name: grafana-oidc
      namespace: monitoring
    type: Opaque

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  # argocd, not the destination namespace: ArgoCD only reconciles Application
  # objects in its own namespace unless application.namespaces is configured.
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    chart: authelia
    repoURL: https://charts.authelia.com
    targetRevision: 0.11.22
    helm:
      valuesObject:
        pod:
          kind: Deployment
          replicas: 1
          selectors:
            nodeSelector:
              node-role.kubernetes.io/storage-disk: ""
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
        persistence:
          enabled: true
          storageClass: linstor-replicated
          size: 1Gi
          accessModes:
            - ReadWriteOnce
        secret:
          existingSecret: authelia-secrets
          additionalSecrets:
            authelia-users:
              path: users
            authelia-oidc-key:
              path: oidc
        ingress:
          enabled: true
          className: cilium
          annotations:
            cert-manager.io/cluster-issuer: home-ca
          tls:
            enabled: true
            secret: authelia-tls
        configMap:
          theme: dark
          default_2fa_method: totp
          authentication_backend:
            file:
              enabled: true
              path: /secrets/users/users_database.yml
          access_control:
            default_policy: one_factor
          session:
            cookies:
              - domain: svc.home
                subdomain: auth
                default_redirection_url: https://home.svc.home/
          storage:
            local:
              enabled: true
              path: /config/db.sqlite3
          notifier:
            filesystem:
              enabled: true
              filename: /config/notification.txt
          identity_providers:
            oidc:
              enabled: true
              jwks:
                - key_id: main
                  algorithm: RS256
                  use: sig
                  key:
                    path: /secrets/oidc/oidc.jwk.RS256.pem
              clients:
                - client_id: forgejo
                  client_name: Forgejo
                  client_secret: '$pbkdf2-sha512$310000$k1t/9aXKPl2TXyZ4WxnOIA$jeGr/f.tDP4lv1QeyDSN1BZakKtKpBRn.v/Hk6EIt0Zc470F7QnPnxdgrCjZjada0i4vIIeJFOugkFMzIWCP2w'
                  public: false
                  authorization_policy: one_factor
                  require_pkce: true
                  pkce_challenge_method: S256
                  redirect_uris:
                    - https://forgejo.svc.home/user/oauth2/authelia/callback
                  scopes: ['openid', 'profile', 'email', 'groups']
                  userinfo_signed_response_alg: none
                - client_id: grafana
                  client_name: Grafana
                  client_secret: '$pbkdf2-sha512$310000$AhO2DFd.IaVbW82JyOGGYA$JoD1E7SE15qhhh.C8sqkJcrKd4OQ7riZ6dhHiq/itqyHtFUFchCLXU.rrfbYZ9FZU6b1md5jPVue5OIrZFMskg'
                  public: false
                  authorization_policy: one_factor
                  require_pkce: true
                  pkce_challenge_method: S256
                  redirect_uris:
                    - https://grafana.svc.home/login/generic_oauth
                  scopes: ['openid', 'profile', 'email', 'groups']
                  userinfo_signed_response_alg: none
  destination:
    server: "https://kubernetes.default.svc"
    namespace: authelia
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
