# Authelia as the OpenID Connect provider for this cluster, replacing Keycloak.
#
# OIDC only, deliberately. Authelia can also act as a forward-auth gate that puts a
# login wall in front of services with no authentication of their own -- but that
# needs the ingress to call an external authorisation service, and Cilium supports
# neither the nginx-style auth-url annotations nor the Gateway API ExternalAuth
# filter from GEP-1494 (cilium/cilium#45704). Only a hand-written CiliumEnvoyConfig
# with an ext_authz filter would do it. So Hubble UI, Homepage, Prometheus and
# Alertmanager stay unauthenticated for now; Forgejo, Grafana, ArgoCD and Headlamp
# speak OIDC themselves and do not involve the ingress at all.
#
# Users live in LLDAP, not here -- see resources/lldap.yaml. Authelia's own keys are
# generated with the Authelia binary rather than by hand: the random ones with
# `authelia crypto rand`, the OIDC signing key with `authelia crypto pair rsa
# generate`.
#
# sync-wave 1 namespace, 2 secrets, 3 the application -- the SealedSecrets name the
# namespace and cannot wait for the Application to create it.

---
apiVersion: v1
kind: Namespace
metadata:
  name: authelia
  annotations:
    argocd.argoproj.io/sync-wave: "1"

---
# The four keys the chart knows about. Their names are not free: the chart
# mounts exactly these under /secrets/internal and points AUTHELIA_*_FILE
# environment variables at them, so a renamed key is simply not mounted.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: authelia-secrets
  namespace: authelia
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  encryptedData:
    identity_providers.oidc.hmac.key: 
    identity_validation.reset_password.jwt.hmac.key: 
    session.encryption.key: 
    storage.encryption.key: 
  template:
    metadata:
      name: authelia-secrets
      namespace: authelia
    type: Opaque

---
# The RSA key that signs OIDC tokens, in a secret of its own. It cannot live
# in authelia-secrets: the chart builds that volume from a fixed list of four
# items, so any extra key there is silently left out of the pod -- the config
# would reference a path that does not exist.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: authelia-oidc-key
  namespace: authelia
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  encryptedData:
    oidc.jwk.RS256.pem: 
  template:
    metadata:
      name: authelia-oidc-key
      namespace: authelia
    type: Opaque

---
# The password Authelia binds to LLDAP with -- the same value LLDAP creates its
# admin account from, in a secret of its own here. It gets its own secret_name
# rather than joining authelia-secrets, because rewriting that one would mean
# regenerating storage.encryption.key and losing everything already stored.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: lldap-bind
  namespace: authelia
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  encryptedData:
    password.txt: 
  template:
    metadata:
      name: lldap-bind
      namespace: authelia
    type: Opaque

---
# The client secret Forgejo presents to Authelia, in Forgejo's namespace.
# Authelia stores only its pbkdf2-sha512 hash; this is the plaintext half.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: forgejo-oidc
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  encryptedData:
    key: 
    secret: 
  template:
    metadata:
      name: forgejo-oidc
      namespace: forgejo
    type: Opaque

---
# The same for Grafana, in the monitoring namespace.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  encryptedData:
    client-id: 
    client-secret: 
  template:
    metadata:
      name: grafana-oidc
      namespace: monitoring
    type: Opaque

---
# The same for Argo CD. The part-of label on the template carries weight:
# Argo resolves the $argocd-oidc:clientSecret reference in argocd-cm only
# against secrets that have it.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-oidc
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  encryptedData:
    clientSecret: 
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: argocd
      name: argocd-oidc
      namespace: argocd
    type: Opaque

---
# Headlamp's half of the kubernetes client. The key names are the chart's:
# config.oidc.externalSecret expects OIDC_CLIENT_ID, OIDC_CLIENT_SECRET and
# OIDC_ISSUER_URL, and passes them through as command-line arguments.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: headlamp-oidc
  namespace: headlamp
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  encryptedData:
    OIDC_CLIENT_ID: 
    OIDC_CLIENT_SECRET: 
    OIDC_ISSUER_URL: 
    OIDC_SCOPES: 
  template:
    metadata:
      name: headlamp-oidc
      namespace: headlamp
    type: Opaque

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  # argocd, not the destination namespace: ArgoCD only reconciles Application
  # objects in its own namespace unless application.namespaces is configured.
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    chart: authelia
    repoURL: https://charts.authelia.com
    targetRevision: 0.11.22
    helm:
      valuesObject:
        pod:
          kind: Deployment
          replicas: 1
          selectors:
            nodeSelector:
              node-role.kubernetes.io/storage-disk: ""
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
        persistence:
          enabled: true
          storageClass: linstor-replicated
          size: 1Gi
          accessModes:
            - ReadWriteOnce
        secret:
          existingSecret: authelia-secrets
          additionalSecrets:
            authelia-oidc-key:
              path: oidc
            lldap-bind: {}
        ingress:
          enabled: true
          className: cilium
          annotations:
            cert-manager.io/cluster-issuer: home-ca
          tls:
            enabled: true
            secret: authelia-tls
        configMap:
          theme: dark
          default_2fa_method: totp
          authentication_backend:
            # LDAP, not file: a file backend arrives from a Secret, Kubernetes mounts those
            # read-only, and Authelia can then neither add a user nor persist a password
            # change. LLDAP supplies the administration interface Authelia does not have.
            ldap:
              enabled: true
              # Sets the attribute names and the password-reset behaviour LLDAP expects.
              implementation: lldap
              # Plain LDAP inside the cluster; the hop never leaves the pod network.
              address: ldap://lldap.lldap.svc:3890
              base_dn: dc=svc,dc=home
              # The LLDAP admin, because it is the only account that exists before anyone
              # has logged in anywhere. Once you are in the LLDAP interface, create a
              # dedicated read-only service account -- uid=authelia,ou=people,... -- and
              # point this at it instead; binding as admin gives Authelia write access to
              # the whole directory, which it only needs for password resets.
              user: uid=admin,ou=people,dc=svc,dc=home
              password:
                secret_name: lldap-bind
                path: password.txt
          access_control:
            default_policy: one_factor
          session:
            cookies:
              - domain: svc.home
                subdomain: auth
                default_redirection_url: https://home.svc.home/
          storage:
            local:
              enabled: true
              path: /config/db.sqlite3
          notifier:
            filesystem:
              enabled: true
              filename: /config/notification.txt
          identity_providers:
            oidc:
              enabled: true
              jwks:
                - key_id: main
                  algorithm: RS256
                  use: sig
                  key:
                    path: /secrets/oidc/oidc.jwk.RS256.pem
              clients:
                - client_id: forgejo
                  client_name: Forgejo
                  client_secret: '$pbkdf2-sha512$310000$GttJ.6BJySZ15daVI.dbJw$z0.viA7Vh.9T9nxHlxwMdc3o9EWhfzrXQ/PR.crI6TGBaqR1fKZ1lC1r068gLg2bRFOYSNAm5l8kN0//NzeWzw'
                  public: false
                  authorization_policy: one_factor
                  require_pkce: true
                  pkce_challenge_method: S256
                  # Forgejo sends its credentials in the form body. Authelia defaults a
                  # confidential client to client_secret_basic and then rejects the token
                  # request -- reporting a secret mismatch first, which is misleading; the
                  # second message names the actual reason.
                  token_endpoint_auth_method: client_secret_post
                  redirect_uris:
                    - https://forgejo.svc.home/user/oauth2/authelia/callback
                  scopes: ['openid', 'profile', 'email', 'groups']
                  userinfo_signed_response_alg: none
                - client_id: grafana
                  client_name: Grafana
                  client_secret: '$pbkdf2-sha512$310000$AhO2DFd.IaVbW82JyOGGYA$JoD1E7SE15qhhh.C8sqkJcrKd4OQ7riZ6dhHiq/itqyHtFUFchCLXU.rrfbYZ9FZU6b1md5jPVue5OIrZFMskg'
                  public: false
                  authorization_policy: one_factor
                  require_pkce: true
                  pkce_challenge_method: S256
                  redirect_uris:
                    - https://grafana.svc.home/login/generic_oauth
                  scopes: ['openid', 'profile', 'email', 'groups']
                  userinfo_signed_response_alg: none
                - client_id: argocd
                  client_name: Argo CD
                  client_secret: '$pbkdf2-sha512$310000$KrAGMfuryvIMPlO2EFQQjg$m3rzXOgVyvysV9FbKy8WnCKfRYTQtYZK4hA2s/ryhL38.4NhF5jJFGx0ZN1oNZY0iB/fxmsVRgRUCXfpApYRgw'
                  public: false
                  authorization_policy: one_factor
                  # No PKCE here, unlike Grafana and Forgejo: Argo authenticates as a
                  # confidential client with a secret and sends no code_challenge, so
                  # requiring one rejects the authorize request outright.
                  redirect_uris:
                    - https://argocd.svc.home/auth/callback
                    # The CLI opens a local listener and sends the browser back to it.
                    - http://localhost:8085/auth/callback
                  scopes: ['openid', 'profile', 'email', 'groups']
                  userinfo_signed_response_alg: none
                # Named kubernetes, not headlamp: this client id has to match the
                # apiserver's --oidc-client-id, because the apiserver checks it as the
                # token's audience. Headlamp merely carries the token there.
                - client_id: kubernetes
                  client_name: Kubernetes
                  client_secret: '$pbkdf2-sha512$310000$RyQuJ.FUB9a1pfQ0InZY7A$uZOB.T3qW9798/fCMTn.HSHZnXfN0oPu9PaMKe72VDhpv4E47u9VIqD5qp.HjFoUWl.hbigaxB7UEagKZvZi7g'
                  public: false
                  authorization_policy: one_factor
                  require_pkce: true
                  pkce_challenge_method: S256
                  redirect_uris:
                    - https://headlamp.svc.home/oidc-callback
                  scopes: ['openid', 'profile', 'email', 'groups']
                  userinfo_signed_response_alg: none
  destination:
    server: "https://kubernetes.default.svc"
    namespace: authelia
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
