apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  # argocd, not the destination namespace: ArgoCD only reconciles Application
  # objects in its own namespace unless application.namespaces is configured.
  namespace: argocd
spec:
  project: default
  source:
    chart: headlamp
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    targetRevision: 0.45.0
    helm:
      valuesObject:
        # LoadBalancer instead of Ingress: the Cilium ingress path is currently
        # broken (Envoy never receives service backends), while LoadBalancer IPs
        # from the 192.168.1.20-29 pool work fine.
        service:
          type: LoadBalancer
  destination:
    server: "https://kubernetes.default.svc"
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
