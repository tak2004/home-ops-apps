apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  # argocd, not the destination namespace: ArgoCD only reconciles Application
  # objects in its own namespace unless application.namespaces is configured.
  namespace: argocd
spec:
  project: default
  source:
    chart: headlamp
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    targetRevision: 0.45.0
    helm:
      valuesObject:
        # Reached through the shared cilium-ingress, which the *.svc.home wildcard
        # in bind9 resolves to. No dedicated LoadBalancer IP and no DNS record of
        # its own are needed.
        service:
          type: ClusterIP
        ingress:
          enabled: true
          ingressClassName: cilium
          hosts:
            - host: headlamp.svc.home
              paths:
                - path: /
                  type: Prefix
  destination:
    server: "https://kubernetes.default.svc"
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
