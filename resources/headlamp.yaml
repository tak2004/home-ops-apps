apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  # argocd, not the destination namespace: ArgoCD only reconciles Application
  # objects in its own namespace unless application.namespaces is configured.
  namespace: argocd
spec:
  project: default
  source:
    chart: headlamp
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    targetRevision: 0.45.0
    helm:
      valuesObject:
        # Reached through the shared cilium-ingress, which the *.svc.home wildcard
        # in bind9 resolves to. No dedicated LoadBalancer IP and no DNS record of
        # its own are needed.
        # Knative ships no web interface of its own -- only the kn CLI -- so the
        # Headlamp plugin is the way to see Services, Revisions and routes in a
        # browser. The sidecar installs it at startup and watches the config, so a
        # version change here does not need a pod restart.
        # Headlamp fetches Authelia's discovery document and exchanges the code
        # itself, so it has to trust the private CA. Dropping the certificate into
        # /etc/ssl/certs is not enough: Go reads that directory only when it finds no
        # bundle file, and the image has one. The chart exposes no way to set
        # SSL_CERT_DIR either, so the bundle is rebuilt -- system plus this CA -- and
        # mounted over the original as a single file.
        initContainers:
          - name: ca-bundle
            image: docker.io/alpine:3.21
            command:
              - sh
              - -c
              - cat /etc/ssl/certs/ca-certificates.crt /home-ca/ca.crt > /bundle/ca-certificates.crt
            volumeMounts:
              - name: ca-bundle
                mountPath: /bundle
              - name: home-ca
                mountPath: /home-ca
                readOnly: true
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
        volumes:
          - name: ca-bundle
            emptyDir:
              sizeLimit: 8Mi
          - name: home-ca
            secret:
              secretName: headlamp-ca
              items:
                - key: ca.crt
                  path: ca.crt
        volumeMounts:
          - name: ca-bundle
            mountPath: /etc/ssl/certs/ca-certificates.crt
            subPath: ca-certificates.crt
            readOnly: true
        config:
          oidc:
            # The client id here has to be the one the apiserver checks as the
            # token's audience, which is why it is called kubernetes rather than
            # headlamp: Headlamp only carries the token, the apiserver decides.
            secret:
              create: false
            externalSecret:
              enabled: true
              name: headlamp-oidc
              # The scopes live in that secret too. With this false the chart omits
              # -oidc-scopes entirely, and the groups claim -- which is the whole
              # point -- would never be requested.
              hasScopes: true
            callbackURL: https://headlamp.svc.home/oidc-callback
            usePKCE: true
          # The plugin manager writes into the plugin directory while Headlamp is
          # already starting, and Headlamp otherwise reads that directory once at
          # startup. Measured: the container came up at 20:47:18, the plugin landed
          # the same minute, and the server's /plugins endpoint listed only the
          # bundled one. Watching the directory removes the race instead of papering
          # over it with a restart.
          watchPlugins: true
        pluginsManager:
          enabled: true
          configContent: |
            plugins:
              - name: headlamp_knative
                source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_knative
                version: 0.3.0-beta
            installOptions:
              parallel: true
              maxConcurrent: 2
        service:
          type: ClusterIP
        ingress:
          enabled: true
          ingressClassName: cilium
          annotations:
            # cert-manager issues the certificate from the private home-ca.
            cert-manager.io/cluster-issuer: home-ca
            # Picked up by the homepage dashboard, which reads ingresses itself.
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: "Headlamp"
            gethomepage.dev/group: "Cluster"
            gethomepage.dev/icon: kubernetes.svg
            gethomepage.dev/description: "Cluster-Oberflaeche"
          hosts:
            - host: headlamp.svc.home
              paths:
                - path: /
                  type: Prefix
          tls:
            - secretName: headlamp-tls
              hosts:
                - headlamp.svc.home
  destination:
    server: "https://kubernetes.default.svc"
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
# Materialises ca.crt in this namespace. cert-manager places the issuing CA beside
# everything it signs, so a certificate nobody serves is the cheapest way to obtain
# it -- copying cert-manager's own secret would copy the CA's private key too.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headlamp-ca
  namespace: headlamp
spec:
  secretName: headlamp-ca
  commonName: headlamp.internal
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: home-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
# Who may do what once the apiserver accepts an Authelia token. The oidc: prefix is
# not decoration -- it matches --oidc-groups-prefix on the apiserver and keeps these
# names from colliding with Kubernetes' own groups, where a group called admins
# could otherwise be asserted by anything that can mint a token.
#
# Membership is decided in LLDAP and evaluated at every login, so access is
# withdrawn by removing someone from the group rather than by editing this.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: oidc:admins
