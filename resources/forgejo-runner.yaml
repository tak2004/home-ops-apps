# A Forgejo Actions runner, in the shape GitLab's docker executor has: the runner
# reads the image named in the workflow and starts a container per job.
#
# The engine is Podman, not Docker-in-Docker. Podman cannot drive containerd -- it
# has its own daemonless stack -- but it serves the Docker API, which is all
# act_runner needs, and it does so rootless. That matters here: docker:dind requires
# privileged: true, and this pod runs on the nodes that also carry LINSTOR. Podman
# needs SETUID, SETGID and SYS_CHROOT plus access to /dev/fuse instead, which is a
# considerably smaller grant than the whole kernel.
#
# Checked on both netsvc nodes before choosing this: /dev/fuse is present,
# kernel.unprivileged_userns_clone is 1, and the cgroup hierarchy is v2.
#
# On the resource model, which is the point of this deployment:
#
#   Requests and limits are both set on purpose. Specifying only a limit makes
#   Kubernetes copy it into the request, which would reserve the maximum around the
#   clock -- the opposite of what is wanted. With both set the pod is Burstable: it
#   holds a small reservation while idle and may grow to the limit under load.
#
#   A container that reaches its memory limit is killed by its own cgroup, not by the
#   node. The host is safe because the limit exists; the danger is a pod without one.
#   Job containers are children of the Podman service and share its cgroup, so the
#   limit on that sidecar is the ceiling for every job at once, however many run.
#
#   Disk is bounded the same way. The image store is an emptyDir with a sizeLimit, so
#   it occupies nothing until a build pulls something, and the kubelet evicts the pod
#   rather than filling the node's root filesystem. Only the registration state is on
#   a claim, and only because losing it on every restart would leave a trail of dead
#   runners registered in Forgejo.
---
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo-runner
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
# Issued by Forgejo itself with
#
#   forgejo forgejo-cli actions generate-runner-token
#
# and used once, by the init container. After registration the runner
# authenticates with what it wrote to its claim, so revoking this token does not
# disconnect an already registered runner.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: forgejo-runner-token
  namespace: forgejo-runner
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: forgejo-runner-token
      namespace: forgejo-runner
    type: Opaque
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo-runner
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  config.yaml: |
    log:
      level: info
    runner:
      # Two jobs at a time. They share the Podman sidecar's memory limit, so this is
      # the number to lower if builds start being killed, rather than the limit to
      # raise.
      capacity: 2
      timeout: 1h
      # What a workflow may ask for in runs-on. The part after the colon is the
      # image the job runs in, exactly as GitLab resolves image:.
      labels:
        - 'docker:docker://node:22-bookworm'
        - 'ubuntu-latest:docker://node:22-bookworm'
        - 'ubuntu-22.04:docker://node:22-bookworm'
    cache:
      enabled: true
      dir: /data/cache
    container:
      network: bridge
      privileged: false
      options: ''
      workdir_parent: workspace
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-runner-data
  namespace: forgejo-runner
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  # Small and replicated: this holds the .runner registration file and the cache,
  # nothing else. Without it every restart registers anew and Forgejo collects dead
  # runners.
  storageClassName: linstor-replicated
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  # One claim, ReadWriteOnce: the old pod has to release it before the new one
  # starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      nodeSelector:
        node-role.kubernetes.io/storage-disk: ""
      # Without fsGroup the freshly provisioned volume belongs to root and the
      # runner, which does not, fails registration with
      # "failed to save runner config: open .runner: permission denied".
      securityContext:
        fsGroup: 1000
      initContainers:
        # Registration writes .runner next to the config. It is skipped when the
        # file is already there, so a restart does not produce a second runner.
        - name: register
          image: code.forgejo.org/forgejo/runner:13.2.0
          command:
            - sh
            - -c
            - |
              set -e
              if [ -f /data/.runner ]; then
                echo "bereits registriert, nichts zu tun"
                exit 0
              fi
              forgejo-runner register --no-interactive \
                --instance https://forgejo.svc.home \
                --token "$RUNNER_TOKEN" \
                --name "$(hostname)" \
                --labels docker:docker://node:22-bookworm
          workingDir: /data
          env:
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-token
                  key: token
            # Registration talks to Forgejo over HTTPS and has to trust the private
            # CA. Both directories, because Go reads SSL_CERT_DIR instead of its
            # defaults rather than in addition to them.
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/ssl/home-ca
          volumeMounts:
            - name: data
              mountPath: /data
            - name: home-ca
              mountPath: /etc/ssl/home-ca
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:13.2.0
          command: ['forgejo-runner', 'daemon', '--config', '/config/config.yaml']
          workingDir: /data
          env:
            # Podman's Docker-compatible socket, on a volume both containers share.
            # A unix socket rather than TCP, so there is no TLS to set up and
            # nothing listening beyond the pod.
            - name: DOCKER_HOST
              value: unix:///run/podman/podman.sock
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/ssl/home-ca
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: podman-socket
              mountPath: /run/podman
            - name: home-ca
              mountPath: /etc/ssl/home-ca
              readOnly: true
          # The runner only orchestrates; the work happens in the sidecar's
          # containers, which is why this limit is small.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
        - name: podman
          image: quay.io/podman/stable:v5.8.7
          command:
            - podman
            - system
            - service
            - --time=0
            - unix:///run/podman/podman.sock
          securityContext:
            # Not privileged. These three capabilities plus /dev/fuse are what
            # rootless Podman needs to map users into its namespace and mount
            # fuse-overlayfs; allowPrivilegeEscalation has to be true for the
            # setuid helpers that perform the mapping.
            privileged: false
            allowPrivilegeEscalation: true
            runAsUser: 1000
            capabilities:
              add: ['SETUID', 'SETGID', 'SYS_CHROOT']
            # The default profile blocks the namespace and mount syscalls the above
            # exists to permit.
            seccompProfile:
              type: Unconfined
          env:
            # The kernel overlay driver needs privileges Podman does not have here;
            # the FUSE implementation is the point of mounting /dev/fuse.
            - name: STORAGE_DRIVER
              value: overlay
            - name: _CONTAINERS_USERNS_CONFIGURED
              value: ''
          volumeMounts:
            - name: podman-socket
              mountPath: /run/podman
            - name: podman-storage
              mountPath: /home/podman/.local/share/containers
            - name: fuse
              mountPath: /dev/fuse
          # This limit is the ceiling for every job container at once -- they are
          # children of this service and live in its cgroup. A build that exceeds it
          # is killed here, and the node is untouched.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 8Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-runner-data
        - name: config
          configMap:
            name: forgejo-runner-config
        - name: podman-socket
          emptyDir:
            sizeLimit: 8Mi
        # Pulled images and build layers. Empty until something is built, and
        # bounded so a runaway build cannot fill the node's root filesystem.
        - name: podman-storage
          emptyDir:
            sizeLimit: 20Gi
        - name: fuse
          hostPath:
            path: /dev/fuse
            type: CharDevice
        - name: home-ca
          secret:
            secretName: forgejo-runner-ca
            items:
              - key: ca.crt
                path: ca.crt
---
# Materialises ca.crt in this namespace. cert-manager puts the issuing CA beside
# every certificate it signs, so a certificate nobody serves is the cheapest way to
# obtain it -- copying the secret from cert-manager's namespace would also copy the
# CA's private key.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: forgejo-runner-ca
  namespace: forgejo-runner
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: forgejo-runner-ca
  commonName: forgejo-runner.internal
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: home-ca
    kind: ClusterIssuer
    group: cert-manager.io
