apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  # argocd, not the destination namespace: ArgoCD only reconciles Application
  # objects in its own namespace unless application.namespaces is configured.
  namespace: argocd
spec:
  project: default
  source:
    chart: sealed-secrets
    # The chart moved from bitnami-labs to bitnami on 2026-06-15; the old URL
    # returns 404, which made ArgoCD fail with "error fetching chart".
    repoURL: https://bitnami.github.io/sealed-secrets
    targetRevision: 2.20.0
    helm:
      valuesObject:
        fullnameOverride: sealed-secrets-controller
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
