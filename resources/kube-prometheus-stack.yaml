# The monitoring namespace as an explicit object in the first wave: the SealedSecret
# below names it, and cannot wait for the Application to create it.
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
# Grafana's local administrator. It exists as the way back in when SSO is broken --
# which is when you most need Grafana. Read it with
#
#   kubectl -n monitoring get secret grafana-admin \
#     -o jsonpath='{.data.admin-password}' | base64 -d
#
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  encryptedData:
    admin-password: 
    admin-user: 
  template:
    metadata:
      name: grafana-admin
      namespace: monitoring
    type: Opaque
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  # argocd, not the destination namespace: ArgoCD only reconciles Application
  # objects in its own namespace unless application.namespaces is configured.
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 91.7.0
    helm:
      valuesObject:
        # Everything heavy onto the netsvc nodes. They carry 64 GB each and idle at
        # two to five percent, while backbone-1 has 7.8 GB and sits at half. The two
        # SBCs have 1.9 GB and a control-plane taint, so nothing lands there anyway.
        # storage-disk is the label only the netsvc nodes carry -- backbone-1 also
        # has "storage", because it is the diskless DRBD tiebreaker.
        prometheus:
          prometheusSpec:
            # This instance is the live, high-resolution view and deliberately owns
            # no durable storage: it can be scheduled anywhere and is back within
            # seconds, at the price of losing its window on every restart. Long-term
            # data is a separate concern and does not belong here.
            retention: 4h
            # Retention alone is a time limit, not a size limit, and this volume is
            # shared with everything else on the node's root filesystem. A burst of
            # new series would fill it; with both set Prometheus prunes first.
            # Measured steady state is ~320 MiB (WAL ~200, two 2h blocks ~120).
            retentionSize: 600MB
            nodeSelector:
              node-role.kubernetes.io/storage-disk: ""
            resources:
              requests:
                cpu: 200m
                memory: 768Mi
              # Measured at 121k series: 735 MiB RSS after an hour, with the head
              # not yet holding its full 2h. Note that 4h retention saves storage,
              # not memory -- the head is always 2h regardless of how long blocks
              # are kept, so this is the same footprint the 7d setup had.
              limits:
                memory: 1536Mi
            storageSpec:
              # emptyDir, not a PVC: Prometheus data here is rebuildable by
              # re-scraping, so neither DRBD nor a node-pinned local disk earns its
              # constraints. Without a claim the pod is free to move between
              # netsvc-1 and netsvc-2 and is serving again within seconds.
              #
              # Deliberately NOT medium: Memory. tmpfs would charge every stored
              # byte to the pod's memory limit on top of the head Prometheus
              # already keeps in RAM. Plain emptyDir is a directory under
              # /var/lib/kubelet on the node's NVMe -- same lifetime, no RAM cost.
              emptyDir:
                # Bounds what a runaway cardinality can do to the node's root
                # filesystem: past this the kubelet evicts the pod, which is a
                # clean restart rather than a full disk shared with the kubelet.
                sizeLimit: 2Gi
            # Without this the operator only picks up ServiceMonitors carrying the
            # release label, which silently ignores anything created by other charts.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
          ingress:
            enabled: true
            ingressClassName: cilium
            annotations:
              cert-manager.io/cluster-issuer: home-ca
              gethomepage.dev/enabled: "true"
              gethomepage.dev/name: "Prometheus"
              gethomepage.dev/group: "Monitoring"
              gethomepage.dev/icon: prometheus.svg
              gethomepage.dev/description: "Metriken und Abfragen"
            hosts:
              - prometheus.svc.home
            paths: ["/"]
            pathType: Prefix
            tls:
              - secretName: prometheus-tls
                hosts: [prometheus.svc.home]

        grafana:
          nodeSelector:
            node-role.kubernetes.io/storage-disk: ""
          # No volume. Grafana keeps users, preferences and UI-created dashboards in
          # a SQLite file; without persistence those are gone on every restart. That
          # is acceptable precisely because everything below arrives through the
          # sidecars instead -- a dashboard clicked together in the browser is not
          # supposed to survive here, it is supposed to become a ConfigMap.
          persistence:
            enabled: false
          # The local account, kept as the way back in when SSO is broken -- which is
          # exactly when you need Grafana to look at why. Everyone else signs in
          # through Authelia below.
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          # Grafana calls the token and userinfo endpoints itself, server to server,
          # and has to trust the private CA for that. Not the secret from
          # cert-manager's namespace -- that one also holds the CA's private key.
          # Every certificate home-ca issues carries ca.crt alongside it, so the
          # ingress certificate that already exists here is enough.
          extraSecretMounts:
            - name: home-ca
              secretName: grafana-tls
              mountPath: /etc/grafana/ca
              readOnly: true
              defaultMode: 0440
              items:
                - key: ca.crt
                  path: ca.crt
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oidc
                key: client-secret
          grafana.ini:
            log:
              # Only this logger, and only until the role mapping is settled: it
              # writes the claims actually received from Authelia, which is the one
              # thing that cannot be observed from outside.
              filters: oauth.generic_oauth:debug
            server:
              root_url: https://grafana.svc.home
            auth:
              # Ends the Authelia session too, instead of leaving one behind that
              # signs you straight back in.
              signout_redirect_url: https://auth.svc.home/logout
            auth.generic_oauth:
              enabled: true
              name: Authelia
              icon: signin
              client_id: grafana
              scopes: openid profile email groups
              auth_url: https://auth.svc.home/api/oidc/authorization
              token_url: https://auth.svc.home/api/oidc/token
              api_url: https://auth.svc.home/api/oidc/userinfo
              login_attribute_path: preferred_username
              name_attribute_path: name
              groups_attribute_path: groups
              use_pkce: true
              tls_client_ca: /etc/grafana/ca/ca.crt
              # LLDAP puts everyone who may administer the directory in lldap_admin;
              # 'admins' is there for a group you create yourself. Anyone else gets
              # read access rather than none, so a new account is useful immediately.
              role_attribute_path: contains(groups[*], 'lldap_admin') && 'Admin' || contains(groups[*], 'admins') && 'Admin' || 'Viewer'
          sidecar:
            # searchNamespace: ALL is the part that matters. By default each sidecar
            # only watches its own namespace, so a dashboard shipped next to the
            # application it describes would never be found. With ALL, any namespace
            # can carry a labelled ConfigMap and it shows up here.
            #
            # HEALTH_PORT has to differ per sidecar. All three share the pod's
            # network namespace and default to 8080, so the second and third die on
            # bind with "OSError: [Errno 98] Address in use" -- and that exception
            # kills the collector thread before it ever lists ConfigMaps. The
            # container stays Running and ready, the target directory just stays
            # empty: Grafana came up with no datasource and nothing looked broken.
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL
              folderAnnotation: grafana_folder
              env:
                HEALTH_PORT: "8082"
              provider:
                # Without this every dashboard lands in one flat folder.
                foldersFromFilesStructure: true
            datasources:
              enabled: true
              searchNamespace: ALL
              defaultDatasourceEnabled: true
              env:
                HEALTH_PORT: "8083"
            alerts:
              enabled: true
              label: grafana_alert
              searchNamespace: ALL
              env:
                HEALTH_PORT: "8084"
          ingress:
            enabled: true
            ingressClassName: cilium
            annotations:
              cert-manager.io/cluster-issuer: home-ca
              gethomepage.dev/enabled: "true"
              gethomepage.dev/name: "Grafana"
              gethomepage.dev/group: "Monitoring"
              gethomepage.dev/icon: grafana.svg
              gethomepage.dev/description: "Dashboards"
            hosts:
              - grafana.svc.home
            path: /
            pathType: Prefix
            tls:
              - secretName: grafana-tls
                hosts: [grafana.svc.home]

        alertmanager:
          alertmanagerSpec:
            nodeSelector:
              node-role.kubernetes.io/storage-disk: ""
            # Alertmanager has no sidecar; the operator is the equivalent. An empty
            # selector makes it watch AlertmanagerConfig resources in every
            # namespace, so routes and receivers are custom resources next to what
            # they alert on instead of one block of config in these values.
            alertmanagerConfigSelector: {}
            alertmanagerConfigNamespaceSelector: {}
          # No volume: the only state is silences and notification history, and with
          # no routes configured there is nothing to lose. No ingress for the same
          # reason -- the UI would be an empty page.
          ingress:
            enabled: false

        # The only DaemonSet this chart brings. Its default toleration is
        # "operator: Exists" on NoSchedule, which puts it on the two SBCs as well --
        # and those are meant to carry the control plane and nothing else. Emptying
        # the list keeps it on the untainted nodes: backbone-1 and both netsvc.
        #
        # The cost is real: backbone-2 and backbone-3 sit at 64 and 79 percent
        # memory, so they are exactly the nodes whose host metrics would be worth
        # having. Re-add a control-plane toleration here if that visibility is
        # wanted back -- the agent itself needs about 25 MB.
        prometheus-node-exporter:
          tolerations: []
          resources:
            requests:
              cpu: 20m
              memory: 24Mi
            limits:
              memory: 64Mi

        # A Deployment, not a DaemonSet, but it has no node preference of its own
        # and would otherwise be free to land on backbone-1.
        kube-state-metrics:
          nodeSelector:
            node-role.kubernetes.io/storage-disk: ""
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi

        prometheusOperator:
          nodeSelector:
            node-role.kubernetes.io/storage-disk: ""

        # kubeadm binds both of these to 127.0.0.1, so their ServiceMonitors would
        # never connect and the targets page would stay permanently red. Enabling them
        # means changing --bind-address on all three control-plane nodes, which is a
        # separate decision -- their metrics are rarely actionable in a homelab.
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        # Same story plus client certificates.
        kubeEtcd:
          enabled: false
        # Cilium replaces kube-proxy here, so there is nothing to scrape.
        kubeProxy:
          enabled: false
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The chart ships the Prometheus Operator CRDs, which exceed the annotation
      # size limit that kubectl apply uses to store its last-applied state.
      - ServerSideApply=true
