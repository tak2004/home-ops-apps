# A private CA for the internal *.svc.home names. Public CAs are not an option:
# the zone only exists inside this network, so Let's Encrypt cannot validate it.
# Import ca.crt (from the home-ca secret) into browsers and operating systems once,
# then every service below the wildcard gets a trusted certificate automatically.
#
# sync-wave 1 on every object: cert-manager and its CRDs are installed in wave 0,
# and these resources cannot be created before those CRDs exist.
---
# Bootstrap issuer, used solely to sign the CA certificate below.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  isCA: true
  commonName: home-ca
  secretName: home-ca
  duration: 87600h    # 10 years -- importing a new root everywhere is painful
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
# The issuer every Ingress refers to via cert-manager.io/cluster-issuer: home-ca.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: home-ca
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ca:
    secretName: home-ca
