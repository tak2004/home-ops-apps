# The LINSTOR cluster itself. It lives in its own Application, not next to the
# other resources: these kinds only exist once the operator installed its CRDs, and
# inside app-of-apps a failed apply blocked every unrelated resource beside it.
---
apiVersion: piraeus.io/v1
kind: LinstorCluster
metadata:
  name: linstorcluster
spec:
  # Storage lives on the netsvc nodes only. The backbone SBCs run their root
  # filesystem over a USB-SATA bridge -- replicating onto that would inherit
  # exactly the stalls that already cost this cluster two outages.
  nodeSelector:
    node-role.kubernetes.io/storage: ""
---
# Without host networking the satellite configures DRBD inside the pod's network
# namespace, where the storage link does not exist -- the connection between the
# two storage nodes stays in Connecting forever while the one to the tiebreaker,
# which uses pod addresses, comes up fine.
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: host-network
spec:
  podTemplate:
    spec:
      hostNetwork: true
---
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: storage-pool
spec:
  # Only the nodes with the loop-mounted pool image. The tiebreaker also runs a
  # satellite, but must not get a pool -- without the mount the directory would
  # land on its root filesystem.
  nodeSelector:
    node-role.kubernetes.io/storage-disk: ""
  storagePools:
    - name: pool1
      # FILE_THIN: volumes are sparse files under this directory, which Ansible
      # loop-mounts from a 300G image so the pool cannot fill the root filesystem.
      fileThinPool:
        directory: /var/lib/linstor-pools/pool1
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: linstor-replicated
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: linstor.csi.linbit.com
allowVolumeExpansion: true
# WaitForFirstConsumer, so LINSTOR places the replicas after the scheduler picked a
# node -- with Immediate a pod can land where no replica is and read over the network.
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
parameters:
  linstor.csi.linbit.com/storagePool: pool1
  # Two data replicas. The quorum's third vote comes from a diskless tiebreaker,
  # which LINSTOR places on its own on a satellite without a pool -- backbone-1.
  linstor.csi.linbit.com/placementCount: "2"
  linstor.csi.linbit.com/allowRemoteVolumeAccess: "true"
---
# Without this DRBD replicates over whichever address LINSTOR registered for the
# node -- the 1G home network. The selector limits the connection to the two nodes
# carrying a pool: the tiebreaker has no storage link, and a path naming an
# interface it does not have would never be configured.
apiVersion: piraeus.io/v1
kind: LinstorNodeConnection
metadata:
  name: replication-link
spec:
  selector:
    - matchLabels:
        - key: node-role.kubernetes.io/storage-disk
          op: Exists
  paths:
    - name: storage-link
      interface: replication
---
# A second pool, on the SATA SSD each netsvc node carries. Measured on netsvc-1's
# drive, same disk, same fio geometry, only the layering differs:
#
#   raw device                                  1315 commits/s (QD1)
#   LVM thin, warmed                             350
#   ext4 -> image -> loop -> ext4 (like pool1)    72 ... 214, and it scatters
#
# So the win is not thin provisioning -- LVM thick measured 361, indistinguishable
# from thin -- it is dropping the loop device and the second ext4. A freshly created
# thin volume is slow (112 commits/s) until its chunks are allocated once; that cost
# is paid per volume, not per write.
#
# Per node instead of one selector-matched object: the two nodes hold different
# drives, so the by-id paths differ. Naming the device explicitly also makes it
# visible which physical disk a node hands to LINSTOR -- /dev/sda would work today
# (the FCH exposes exactly one SATA port) but stops being unambiguous the moment
# SL_SAS is switched from PCIe to its four SATA lanes.
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: storage-pool-fast-netsvc-1
spec:
  nodeSelector:
    kubernetes.io/hostname: netsvc-1
  storagePools:
    - name: pool2
      source:
        hostDevices:
          - /dev/disk/by-id/ata-Samsung_SSD_850_EVO_250GB_S2R6NX0H624228J
      lvmThinPool:
        volumeGroup: linstorvg
        thinPool: thinpool
---
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: storage-pool-fast-netsvc-2
spec:
  nodeSelector:
    kubernetes.io/hostname: netsvc-2
  storagePools:
    - name: pool2
      source:
        hostDevices:
          - /dev/disk/by-id/ata-SAMSUNG_SSD_830_Series_S0VZNEAC807268
      lvmThinPool:
        volumeGroup: linstorvg
        thinPool: thinpool
---
# For everything that calls fsync: databases, etcd, registry metadata. Small writes
# where commit latency decides, not bandwidth -- a 4K commit does not care that SATA
# caps at 550 MB/s. linstor-replicated stays on pool1, which has the NVMe behind it
# and wins on sequential throughput by a factor of four.
#
# Neither drive has power-loss protection, so this is not the end state: both are
# consumer SSDs that must flush to NAND on every barrier. It is the free half of the
# improvement, taken while flash prices are inflated.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: linstor-fast
provisioner: linstor.csi.linbit.com
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
parameters:
  linstor.csi.linbit.com/storagePool: pool2
  linstor.csi.linbit.com/placementCount: "2"
  linstor.csi.linbit.com/allowRemoteVolumeAccess: "true"
---
# Was applied by hand with kubectl and existed only in the cluster, not here. One
# replica, no redundancy -- for scratch data that can be recreated, and for measuring
# the replication overhead against linstor-replicated.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: linstor-single
provisioner: linstor.csi.linbit.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
parameters:
  linstor.csi.linbit.com/storagePool: pool1
  linstor.csi.linbit.com/placementCount: "1"
