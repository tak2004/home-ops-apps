# The LINSTOR cluster itself. It lives in its own Application, not next to the
# other resources: these kinds only exist once the operator installed its CRDs, and
# inside app-of-apps a failed apply blocked every unrelated resource beside it.
---
apiVersion: piraeus.io/v1
kind: LinstorCluster
metadata:
  name: linstorcluster
spec:
  # Storage lives on the netsvc nodes only. The backbone SBCs run their root
  # filesystem over a USB-SATA bridge -- replicating onto that would inherit
  # exactly the stalls that already cost this cluster two outages.
  nodeSelector:
    node-role.kubernetes.io/storage: ""
---
# Without host networking the satellite configures DRBD inside the pod's network
# namespace, where the storage link does not exist -- the connection between the
# two storage nodes stays in Connecting forever while the one to the tiebreaker,
# which uses pod addresses, comes up fine.
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: host-network
spec:
  podTemplate:
    spec:
      hostNetwork: true
---
# Both nodes now run pool1 as thick LVM on their NVMe, which is what
# linstor-replicated needed all along -- until today it was a sparse file on a loop
# device on the root filesystem.
#
# netsvc-2's NVMe is twice the size, but its pool is deliberately the same 315.3
# GiB as netsvc-1's: replication is bounded by the smaller side, so a surplus here
# could only ever hold single-replica volumes. The extra 465 GiB stays with the
# root filesystem, where it is generically useful.
# netsvc-1's pool1, now thick LVM on the NVMe. Its root partition was shrunk from
# 464 to 150 GiB offline to make room for this physical volume; 18 GiB are in use,
# so the remaining headroom is eightfold.
#
# This is what the whole conversion was for: pool1 and pool2 now differ in exactly
# one thing on this node -- pool1 sits on the NVMe, pool2 on a SATA SSD, both thick
# LVM, both under the same DRBD tuning. Every earlier comparison varied medium and
# backend together and could not separate them.
#
# netsvc-2 still runs pool1 as FILE_THIN, so replicated volumes on pool1 are mixed
# backend until that node is converted too. Single-replica volumes pinned to
# netsvc-1 are the clean measurement in the meantime.
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: storage-pool-netsvc-1
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  nodeSelector:
    kubernetes.io/hostname: netsvc-1
  storagePools:
    - name: pool1
      source:
        hostDevices:
          - /dev/disk/by-id/nvme-CT500P3SSD8_241347E7F7A2-part3
      lvmPool:
        volumeGroup: linstornvme
---
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: storage-pool-netsvc-2
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  nodeSelector:
    kubernetes.io/hostname: netsvc-2
  storagePools:
    - name: pool1
      source:
        hostDevices:
          - /dev/disk/by-id/nvme-CT1000P3SSD8_235245ECC828-part3
      lvmPool:
        volumeGroup: linstornvme
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: linstor-replicated
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
    # The parameters below are immutable, so Argo has to replace, not patch.
    argocd.argoproj.io/sync-options: Replace=true
provisioner: linstor.csi.linbit.com
allowVolumeExpansion: true
# WaitForFirstConsumer, so LINSTOR places the replicas after the scheduler picked a
# node -- with Immediate a pod can land where no replica is and read over the network.
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
parameters:
  linstor.csi.linbit.com/storagePool: pool1
  # Two data replicas. The quorum's third vote comes from a diskless tiebreaker,
  # which LINSTOR places on its own on a satellite without a pool -- backbone-1.
  linstor.csi.linbit.com/placementCount: "2"
  # false, per LINBIT: the scheduler then has to place the pod where a replica
  # already is, instead of reaching across the network for every I/O. The cost
  # is scheduling freedom -- only netsvc-1 and netsvc-2 hold replicas, so a pod
  # using this class can no longer land on backbone-1, which is schedulable.
  linstor.csi.linbit.com/allowRemoteVolumeAccess: "false"
---
# Without this DRBD replicates over whichever address LINSTOR registered for the
# node -- the 1G home network. The selector limits the connection to the two nodes
# carrying a pool: the tiebreaker has no storage link, and a path naming an
# interface it does not have would never be configured.
apiVersion: piraeus.io/v1
kind: LinstorNodeConnection
metadata:
  name: replication-link
spec:
  selector:
    - matchLabels:
        - key: node-role.kubernetes.io/storage-disk
          op: Exists
  paths:
    - name: storage-link
      interface: replication
---
# A second pool, on the SATA SSD each netsvc node carries. Thick LVM, not thin:
# LINBIT measures 3093 IOPS for thick against 1650 for thin under synchronous
# replication, because thin allocates blocks on first write and that allocation is
# extra I/O on exactly the small-write path this pool exists for. The cost is that
# thick cannot snapshot. Their back-end comparison does not list FILE_THIN at all,
# which is what pool1 still uses.
#
# Per node instead of one selector-matched object: the two nodes hold different
# drives, so the by-id paths differ. Naming the device explicitly also makes it
# visible which physical disk a node hands to LINSTOR -- /dev/sda would work today
# (the FCH exposes exactly one SATA port) but stops being unambiguous the moment
# SL_SAS is switched from PCIe to its four SATA lanes.
#
# Do not read the earlier host-level fio numbers as a prediction for this pool.
# Measured on the bare device, dropping the loop stack looked like a 2-5x win;
# measured through a real PVC, the same change came out slower than pool1. That gap
# is unexplained, so this pool is deployed but unproven.
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: storage-pool-fast-netsvc-1
  annotations:
    # Both the pool type here and StorageClass parameters below are immutable:
    # Kubernetes rejects "updates to parameters are forbidden", and the piraeus
    # admission webhook rejects "Cannot change storage pool type". Argo patches by
    # default and the sync fails; Replace deletes and recreates instead. Safe here
    # because a storage pool definition holds no data -- the volume group on the
    # host outlives it.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  nodeSelector:
    kubernetes.io/hostname: netsvc-1
  storagePools:
    - name: pool2
      source:
        hostDevices:
          - /dev/disk/by-id/ata-Samsung_SSD_850_EVO_250GB_S2R6NX0H624228J
      lvmPool:
        volumeGroup: linstorvg
---
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: storage-pool-fast-netsvc-2
  annotations:
    # Both the pool type here and StorageClass parameters below are immutable:
    # Kubernetes rejects "updates to parameters are forbidden", and the piraeus
    # admission webhook rejects "Cannot change storage pool type". Argo patches by
    # default and the sync fails; Replace deletes and recreates instead. Safe here
    # because a storage pool definition holds no data -- the volume group on the
    # host outlives it.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  nodeSelector:
    kubernetes.io/hostname: netsvc-2
  storagePools:
    - name: pool2
      source:
        hostDevices:
          - /dev/disk/by-id/ata-SAMSUNG_SSD_830_Series_S0VZNEAC807268
      lvmPool:
        volumeGroup: linstorvg
---
# For everything that calls fsync: databases, etcd, registry metadata. Small writes
# where commit latency decides, not bandwidth -- a 4K commit does not care that SATA
# caps at 550 MB/s. linstor-replicated stays on pool1, which has the NVMe behind it
# and wins on sequential throughput by a factor of four.
#
# Neither drive has power-loss protection, so this is not the end state: both are
# consumer SSDs that must flush to NAND on every barrier. It is the free half of the
# improvement, taken while flash prices are inflated.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: linstor-fast
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
provisioner: linstor.csi.linbit.com
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
parameters:
  linstor.csi.linbit.com/storagePool: pool2
  linstor.csi.linbit.com/placementCount: "2"
  # LINBIT recommends false: it forces the scheduler to place the pod where a
  # replica already is, instead of letting it reach across the network for every
  # I/O. Both netsvc nodes carry pool2, so this costs no scheduling freedom here.
  linstor.csi.linbit.com/allowRemoteVolumeAccess: "false"
---
# Was applied by hand with kubectl and existed only in the cluster, not here. One
# replica, no redundancy -- for scratch data that can be recreated, and for measuring
# the replication overhead against linstor-replicated.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: linstor-single
  annotations:
    # The parameters below are immutable, so Argo has to replace, not patch.
    argocd.argoproj.io/sync-options: Replace=true
provisioner: linstor.csi.linbit.com
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
parameters:
  linstor.csi.linbit.com/storagePool: pool1
  linstor.csi.linbit.com/placementCount: "1"
  # With a single replica this is what makes the volume genuinely local: the
  # scheduler must place the pod on the node holding it, instead of attaching it
  # diskless somewhere else and sending every read across the network. The price
  # is that the pod cannot run at all while that one node is down.
  linstor.csi.linbit.com/allowRemoteVolumeAccess: "false"
